<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ClassicPitch — live</title>
  <link rel="stylesheet" href="/shared/style.css" />
  <link rel="stylesheet" href="/live.css" />
  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
</head>
<body>
  <div id="info-drawer">
    <aside id="info-drawer-panel">
      <div id="info-drawer-content">Loading…</div>
    </aside>
    <button id="info-drawer-tab" aria-expanded="false">More Info</button>
  </div>

  <div class="container">
    <h1>ClassicPitch — live</h1>

    <div class="picker-row">
      <label class="picker-label picker-work">
        Input
        <select id="device-select"></select>
      </label>
      <button id="listen-btn">Start listening</button>
    </div>

    <div id="status"></div>

    <div id="live" hidden>
      <div class="representation-controls">
        <div class="controls-left">
          <label class="key-select-label">
            Window
            <select id="window-select">
              <option value="6">6s</option>
              <option value="10" selected>10s</option>
              <option value="20">20s</option>
            </select>
          </label>
          <label class="key-select-label">
            <input id="show-onsets" type="checkbox" checked />
            Onsets
          </label>
        </div>
        <div class="controls-right">
          <span class="level-label">Level</span>
          <div class="level-meter"><span id="level-fill"></span></div>
        </div>
      </div>

      <!-- The staff sits above the roll and is the same grand staff the
           demo app engraves. It shows only
           settled onsets: notation is a commitment, and the live zone is
           precisely where the model has not made one yet. -->
      <details id="notation-panel" class="panel">
        <summary>Staff notation</summary>
        <div class="staff-controls">
          <label class="key-select-label">
            Key
            <select id="key-tonic-select">
              <option value="auto" selected>Auto</option>
              <option value="C">C</option>
              <option value="C#">C♯</option>
              <option value="Db">D♭</option>
              <option value="D">D</option>
              <option value="D#">D♯</option>
              <option value="Eb">E♭</option>
              <option value="E">E</option>
              <option value="F">F</option>
              <option value="F#">F♯</option>
              <option value="G">G</option>
              <option value="G#">G♯</option>
              <option value="Ab">A♭</option>
              <option value="A">A</option>
              <option value="Bb">B♭</option>
              <option value="B">B</option>
            </select>
          </label>
          <select id="key-mode-select">
            <option value="major">major</option>
            <option value="minor">minor</option>
          </select>
          <span id="key-readout" class="decode-status"></span>
        </div>
        <!-- Two layers: /shared/notation.js draws the staves, clefs and
             key signature into the SVG (once, when the key or the width
             changes), and the noteheads go on the canvas above it, which
             is repainted every frame as the music scrolls. -->
        <div id="notation-wrap">
          <div id="notation-svg-target"></div>
          <canvas id="staff-canvas"></canvas>
        </div>
      </details>

      <!-- One roll, scrolling right to left, with "now" at the right
           edge. Unlike the file apps' rolls there is nothing to scroll
           back to: what has left the canvas is gone, since none of this
           audio is kept anywhere. -->
      <div class="roll-section">
        <h3 class="roll-section-title">
          <span class="roll-swatch" style="background: #5aa9ff"></span>Live transcription
        </h3>
        <div id="live-container" class="roll-container">
          <canvas id="live-canvas"></canvas>
        </div>
      </div>

      <!-- The same two thresholds the file apps expose under "Inside the
           model", except here they cost nothing to move: the browser has
           the posteriograms themselves and decodes them as it paints,
           with a port of the file apps' decoder, so there is no round
           trip to re-decode. -->
      <div class="decoding-controls">
        <label class="decode-slider">
          <span>Onset threshold</span>
          <input id="onset-threshold" type="range" min="0.05" max="0.95" step="0.01" value="0.4" />
          <output id="onset-threshold-value">0.40</output>
        </label>
        <label class="decode-slider">
          <span>Frame threshold</span>
          <input id="frame-threshold" type="range" min="0.05" max="0.95" step="0.01" value="0.4" />
          <output id="frame-threshold-value">0.40</output>
        </label>
        <span id="rate-readout" class="decode-status"></span>
      </div>
    </div>
  </div>

  <script src="/shared/key-detection.js"></script>
  <script src="/shared/notation.js"></script>
  <script src="/live.js"></script>
</body>
</html>
